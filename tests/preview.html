<!doctype html><meta charset="utf-8"><body style="margin:0;background:#8a7a6a">
<canvas id="c" width="1200" height="760" style="image-rendering:pixelated"></canvas>
<script type="module">
import {buildPlayers,buildCats,buildBoss} from '../js/sprites_chars.js';
const c=document.getElementById('c'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const P=buildPlayers(),C=buildCats(),B=buildBoss();
const S=4; let px=10,py=10;
for(const [wi,who] of ['masha','anton'].entries()){
  px=10+wi*560; py=10;
  for(const dir of ['down','up','right','left']){
    const set=P[who][dir];
    const frames=[...set.walk,...set.idle.slice(0,1),...set.hug.slice(0,1)];
    frames.forEach((f,i)=>x.drawImage(f.c,px+i*80,py,f.c.width*S,f.c.height*S));
    py+=112;
  }
}
// cats
let cx=10,cy=470;
for(const name of Object.keys(C)){
  const s=C[name];
  const list=[...s.walkR,...s.walkD.slice(0,1),...s.walkU.slice(0,1),...s.sit,...s.eatR.slice(0,1),...s.sleep.slice(0,1)];
  list.forEach((f,i)=>x.drawImage(f.c,cx+i*62,cy,f.c.width*3,f.c.height*3));
  cy+=62;
}
x.drawImage(B.sleep[0].c,640,470,52*3,34*3);
x.drawImage(B.warn[0].c,640+170,470,52*3,34*3);
window.done=true;
</script>
